<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1240" viewBox="0 0 1120 1240" role="img" aria-labelledby="title desc">
<title id="title">Jungle Run: zigzag descent layout proposal</title>
<desc id="desc">Enter at upper left, steer left away from spikes, pass a swinging spider, descend a waterfall, escape the whirlpool and ride the river past a snake to a bottom exit. A ceiling-height wall separates the bonus climb from the spike pit. Its only entrance is a timed jump from the final river ledge, below the wall; a missed jump continues down to the exit.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="none" stroke="#ffcd73" stroke-width="2"/></marker><pattern id="water" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#205966"/><path d="M3 5h12m-6 12h12" stroke="#68c6c2" stroke-width="3"/></pattern></defs>
<style>text{font-family:monospace;fill:#ede9cf;font-size:17px}.small{font-size:14px;fill:#abbfb6}.land{fill:#304e43;stroke:#a2b88d;stroke-width:4}.route{fill:none;stroke:#ffcd73;stroke-width:4;stroke-dasharray:10 8;marker-end:url(#arrow)}.label{font-weight:bold}.hazard{fill:#eb7969}</style>
<rect width="1120" height="1240" fill="#101f24"/>
<text x="48" y="52" style="font-size:30px;font-weight:bold">JUNGLE RUN</text><text x="48" y="82" class="small">ROUTE STUDY / not to scale / proposed geometry / not playable yet</text>
<rect x="48" y="110" width="1024" height="1050" rx="8" fill="#142b2c" stroke="#38504e"/>
<path d="M70 235H688V280H70Z" class="land"/><text x="82" y="178" class="label">1  ENTRANCE →</text><text x="300" y="260" class="small">Arrival shelf / foliage</text>
<path d="M152 210H660Q710 210 715 302L700 380" class="route"/>
<text x="772" y="272" class="label">2  STEER LEFT</text><text x="752" y="295" class="small" style="font-size:12px">Overshoot = spikes</text>
<path d="M260 438H760V485H260Z" class="land"/><path d="M760 475H910V510H760Z" class="land"/>
<path d="M770 474l12-40 12 40 12-40 12 40 12-40 12 40 12-40 12 40 12-40 12 40" class="hazard"/>
<path d="M520 282Q555 325 520 374" fill="none" stroke="#c7d4bc" stroke-width="3"/><ellipse cx="520" cy="384" rx="19" ry="16" class="hazard"/><path d="M504 377l-20-14m20 20-25 5m27 2-20 20m49-33 20-14m-18 20 23 5m-25 2 20 20" stroke="#eb7969" stroke-width="4" fill="none"/>
<text x="288" y="326" class="label">3  SPIDER</text><text x="288" y="350" class="small">Wait, then pass left</text><path d="M705 407H295" class="route"/>
<rect x="190" y="442" width="85" height="354" fill="url(#water)"/><path d="M233 500V733" class="route"/>
<text x="298" y="557" class="label">4  WATERFALL ↓</text><text x="298" y="582" class="small">Forced descent; lateral steering</text>
<path d="M150 842H890V905H150Z" class="land"/><path d="M164 807Q165 765 218 768H308L350 809H890V843H164Z" fill="url(#water)"/>
<ellipse cx="239" cy="800" rx="52" ry="19" fill="none" stroke="#83d5cc" stroke-width="4"/><ellipse cx="239" cy="800" rx="28" ry="9" fill="none" stroke="#83d5cc" stroke-width="3"/>
<text x="78" y="946" class="label">5  WHIRLPOOL</text><text x="78" y="970" class="small">Pull inward; escape right</text><path d="M243 819Q298 820 340 790H552" class="route"/>
<path d="M665 808l-18-146 28-40 20 186" fill="#5b5540"/><path d="M587 671l-19-35 43-32 62 4 23-28 62 44-9 44-61 15Z" fill="#315b43"/>
<path d="M664 732Q616 710 584 743" fill="none" stroke="#eb7969" stroke-width="12"/><path d="M585 743l-15-6 1 16Z" class="hazard"/>
<text x="438" y="694" class="label">6  SNAKE + FAST RIVER →</text><text x="438" y="718" class="small">Time entry from a dry waiting rock</text><path d="M363 809v-29h58v29" class="land"/>
<path d="M590 793H844Q932 793 941 930V1125" class="route"/>
<path d="M890 817Q950 817 956 887V1103H920V897Q920 850 890 844Z" fill="url(#water)"/>
<path d="M960 1128v30m-48-30v30" stroke="#ede9cf" stroke-width="6"/><path d="M936 1138v49" class="route"/><text x="599" y="1080" class="label">8  BOTTOM EXIT ↓</text><text x="599" y="1105" class="small">Defined opening into the next room</text>
<path d="M916 110h24v640h-24Z" class="land"/>
<text x="901" y="620" transform="rotate(-90 901 620)" class="small">SOLID WALL / no access from spike pit</text>
<g class="land"><path d="M985 784h61v17h-61Z"/><path d="M946 724h48v17h-48Z"/><path d="M998 664h48v17h-48Z"/><path d="M946 604h48v17h-48Z"/><path d="M998 544h48v17h-48Z"/></g>
<path d="M878 811Q945 703 1012 771l-44-60 54-60-54-60 54-60" fill="none" stroke="#a9b6e7" stroke-width="3" stroke-dasharray="5 7"/>
<text x="655" y="934" class="label">TIMED JUMP AT THE LIP</text><text x="655" y="958" class="small">Only entrance to the bonus climb</text><path d="M863 916L884 839" stroke="#a9b6e7" stroke-width="2"/>
<text x="953" y="367" class="label" style="font-size:14px">7  BONUS</text><text x="953" y="389" class="label" style="font-size:14px">AREA</text><text x="953" y="412" class="small" style="font-size:12px">Coming later</text><path d="M944 485h102v18H944Z" class="land"/><text x="959" y="472" style="fill:#a9b6e7;font-size:32px">☆</text>
<text x="48" y="1203" class="small">Amber = main route  ·  Lilac = optional climb  ·  Coral = contact hazard  ·  Teal = water force</text>
</svg>
